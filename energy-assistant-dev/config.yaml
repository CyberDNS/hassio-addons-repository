name: Energy Assistant (dev)
version: 0.1.3-dev
slug: energy-assistant-dev
description: Open-source, vendor-neutral energy management platform for homeowners (dev channel — nightly builds from main branch)
url: https://github.com/CyberDNS/energy-assistant
startup: application
init: false
arch:
  - aarch64
  - amd64
boot: auto
map:
  - type: addon_config
    read_only: false
  - type: data
    read_only: false
ingress: true
ingress_port: 8088
# Sidebar entry: the plain name, and the Material Design icon closest to the
# logo (Home Assistant takes no custom image here).
panel_title: Energy Assistant
panel_icon: mdi:home-analytics
# Optional direct port for read-only REST/MCP access from outside ingress.
# Unmapped by default; set a host port in the add-on's Network settings and
# set server.api_token in config.yaml first (see the Energy Assistant README).
ports:
  8088/tcp: null
ports_description:
  8088/tcp: "Read-only REST API + MCP (needs server.api_token; leave empty to disable)"
options: {}
schema: {}
