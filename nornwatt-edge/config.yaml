name: Nornwatt (edge)
version: 0.2.0
slug: nornwatt-edge
description: Open-source, vendor-neutral energy management platform for homeowners (edge channel — validated pre-release builds)
url: https://github.com/CyberDNS/nornwatt
startup: application
init: false
arch:
  - aarch64
  - amd64
boot: auto
map:
  - type: addon_config
    read_only: false
  - type: data
    read_only: false
ingress: true
ingress_port: 8088
# Connects to this Home Assistant on its own (Supervisor proxy + SUPERVISOR_TOKEN),
# so no long-lived token is needed. backends.homeassistant in config.yaml overrides it.
homeassistant_api: true
options: {}
schema: {}
